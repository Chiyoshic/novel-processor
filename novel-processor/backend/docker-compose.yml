services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ./.env
    volumes:
      - ../data:/app/data
    ports:
      - "${API_PORT:-64226}:${HTTP_PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.HTTP_PORT || '8080') + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
