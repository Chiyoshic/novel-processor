# 宝塔 → 网站 → novels.chiyoshi.cn → 设置 → 伪静态。
# 内容对应主配置已 include 的：
# /www/server/panel/vhost/rewrite/html_novels.chiyoshi.cn.conf
# 放在现有 server {} 内，不要再包一层 server {}。
# 如果原文件已有 location / 或 location = /index.html，请修改而不是重复添加。

location / {
    try_files $uri $uri/ /index.html;
}

# 每次加载都取得当前构建入口，避免旧入口继续引用上一版 JS/CSS。
# 不对缺失的 JS/CSS 使用 SPA 回退，已有静态资源 location 继续生效。
location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    # 此处设置 add_header 后不会继承 server 中的 add_header，故保留现有 HSTS。
    add_header Strict-Transport-Security "max-age=31536000" always;
}
